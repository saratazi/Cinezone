<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinezone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
        <h1> Cinezone </h1>
        <h2> View and save your favourite movies 🎥 </h2>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for a movie...">
            <button id="search-button"> Search </button>
        </div>
        <div class="view-buttons">
            <button id="search-view-btn" class="active"> Search Results </button>
            <button id="favorites-view-btn"> My Favourites </button>
            <button id="dark-mode-btn">🌙 Dark Mode</button>
        </div>
    </header>

    <main>
        <div id="search-results" class="movie-container active">
            <!-- Search results will be displayed here -->
        </div>

        <div id="favorites" class="movie-container">
            <!-- Favourites will be displayed here -->
        </div>
    </main>
    <section class="phone-form">
    <h2> Stay Updated</h2>
    <p>Enter your email to receive movie updates.</p>

    <form id="phone-form">
        <input 
            type="tel" 
            id="phone-input" 
            placeholder="Enter your phone number"
            required
        >

        <button type="submit">Submit</button>
    </form>

    <p id="phone-message"></p>
</section>

    <footer>
        <p> Created by Sara </p>
        <p>&copy; <span id="year"></span> Cinezone. All rights reserved.</p>
        <div class="social-links">
        <a href="https://www.linkedin.com/in/saratazi" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
        </a>

        <a href="htttps://github.com/saratazi" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
        </a>

        <a href="https://x.com/sara__tazi" target="_blank" aria-label="x">
            <i class="fab fa-x"></i>
        </a>
    </div>
    
    </footer>

    <script src="script.js"></script>
    <script>
  document.getElementById("year").textContent =
    new Date().getFullYear();
</script>

</body>

</html>
